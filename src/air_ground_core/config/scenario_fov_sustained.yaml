# N1 视场门控场景 B：目标持续出视野（> 容忍窗），验证
#   「持续出视野超过容忍窗 -> TARGET_LOST」。
# 目标沿直线 (11,0)->(3,5) 以 0.8 m/s 往返；航段末端方位角超出 EO 前视 ±50° 视场，
# 目标在该端出视野时长约 2.9 s（> target_lost_tolerance_s=2.0）-> 判 TARGET_LOST。
# 与场景 A 仅 speed_mps 不同（受控差异）；所有阈值在 run 前锁定；本文件哈希写入 run 日志。
scenario_id: fov_sustained
locked: true
note: "N1 持续出视野超容忍窗：目标出视野 > 2.0s -> TARGET_LOST"
car_start: [-4.0, -3.0, 0.11, 0.0]      # x, y, z, yaw；必须与无人机 spawn 点 (0,0) 分开
target_start: [11.0, 0.0, 2.0, 0.0]     # x, y, z, yaw；z 由 target.default_height_m 校验
drone_start: [0.0, 0.0, 0.0]
target_motion:
  mode: linear            # static | linear（匀速往返）
  speed_mps: 0.8
  waypoints: [[3.0, 5.0]]
obstacles:
  - {name: pole_1, pose: [2.5, 0.6, 1.5, 0.0, 0.0, 0.0], size: [0.3, 0.3, 3.0]}
  - {name: pole_2, pose: [4.5, 1.6, 1.5, 0.0, 0.0, 0.0], size: [0.3, 0.3, 3.0]}
map:
  resolution_m: 0.5
  size_x_m: 40.0
  size_y_m: 40.0
  origin_x: -20.0
  origin_y: -20.0
  unknown_is_obstacle: true
thresholds:
  approach_radius_m: 3.0
  hold_window_s: 5.0
  confidence_min: 0.5
  search_timeout_s: 60.0
  approach_timeout_s: 60.0
  mission_timeout_s: 120.0
  target_lost_tolerance_s: 2.0